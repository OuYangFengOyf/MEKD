seed: 42
device: cuda
dataset:
  name: uavid
  root: data/UAVid
  train_split: train
  val_split: val
  image_size: [512, 1024]
  num_classes: 8
  ignore_index: 255
  label_mode: auto
  small_object_quantile: 0.3
  palette:
train:
  epochs: 160
  warmup_epochs: 40
  prototype_start_epoch: 10
  uncertainty_start_epoch: 10
  batch_size: 16
  num_workers: 4
  lr: 0.0004
  weight_decay: 0.01
  save_dir: runs/mekd_uavid
